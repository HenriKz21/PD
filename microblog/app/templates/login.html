{% extends 'base.html' %}

{% block title %}Login - Microblog{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Entrar no Microblog</h2>
    <p class="auth-subtitle">Informe suas credenciais para continuar</p>

    <form action="{{ url_for('login') }}" method="POST" class="form-standard">
        <div class="form-group">
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" placeholder="Seu nome de usuário" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Sua senha secreta" required>
        </div>

        <div class="form-check">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Lembrar meu acesso neste dispositivo</label>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <div class="auth-switch">
        <p>Ainda não possui uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>.</p>
    </div>
</div>
{% endblock %}
